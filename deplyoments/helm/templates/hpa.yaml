{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "hoteler.api.fullname" . }}-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "hoteler.api.fullname" . }}-hpa
spec:
  maxReplicas: {{ .Values.hpa.replicaCount.max }}
  minReplicas: {{ .Values.hpa.replicaCount.min }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hoteler.api.fullname" . }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
{{- end }}