apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hoteler.api.configName" . }}
  namespace: {{ .Release.Namespace }}
data:
  application.yml: |
    server:
      port: {{ .Values.service.port }}
      compression:
        enabled: true
        mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    spring:
      threads:
        virtual:
          enabled: true
      data:
        redis:
          host: {{ .Values.redis.host | quote }}
          port: {{ .Values.redis.port }}
          database: {{ .Values.redis.database }}
          ssl:
            enabled: {{ .Values.redis.ssl | default false }}
      datasource:
        url: {{ .Values.datasource.url | quote }}
        username: {{ .Values.datasource.username | quote }}
        driver-class-name: org.postgresql.Driver
      flyway:
        enabled: {{ .Values.flyway.enabled }}
        baseline-on-migrate: {{ .Values.flyway.baselineOnMigrate }}
      main:
        allow-bean-definition-overriding: true
      quartz:
        properties:
          org:
            quartz:
              scheduler:
                instanceName: clusteredScheduler
                instanceId: AUTO
              jobStore:
                class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
                driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
                tablePrefix: QRTZ_
                isClustered: true
                clusterCheckinInterval: 10000
                useProperties: false
                misfireThreshold: 60000
                txIsolationLevelSerializable: false # 降低隔离级别可以提升跨网络性能
              threadPool:
                class: org.quartz.simpl.SimpleThreadPool
                threadCount: 10
                threadPriority: 5
                threadsInheritContextClassLoaderOfInitializingThread: true
        job-store-type: jdbc
    mybatis:
      configuration:
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    logger:
      level: info
    springdoc:
      packagesToScan: org.daming.hoteler.api.web
      swagger-ui:
        path: /swagger-ui.html
    management:
      endpoint:
        health:
          probes:
            enabled: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "hoteler.web.configName" . }}
data:
  backend_url: {{ printf "http://%s:%v" (include "hoteler.api.fullname" .) .Values.service.port | quote }}
