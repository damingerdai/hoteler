{{- if not .Values.secret.existingSecret }}
{{- $secretName := .Values.secret.existingSecret | default (include "hoteler.secretName" .) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- $secretKey := .Values.secret.key }}
{{- if and (not $secretKey) $existing (hasKey (default (dict) $existing.data) "secret-key") }}
{{- $secretKey = index $existing.data "secret-key" | b64dec }}
{{- end }}
{{- if not $secretKey }}
{{- $secretKey = randAlphaNum 64 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "hoteler.api.fullname" . }}
type: Opaque
data:
  secret-key: {{ $secretKey | b64enc | quote }}
  redis-password: {{ .Values.redis.password | default "" | toString | b64enc | quote }}
  datasource-password: {{ .Values.datasource.password | default "" | toString | b64enc | quote }}
{{- end }}
