apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hoteler.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "hoteler.api.fullname" . }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "hoteler.api.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "hoteler.api.fullname" . }}
      name: {{ include "hoteler.api.fullname" . }}
      annotations:
        checksum/config: {{ include "hoteler.configChecksum" . }}
        checksum/secret: {{ include "hoteler.secretChecksum" . }}
    spec:
      containers:
        - name: {{ include "hoteler.api.fullname" . }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret | default (include "hoteler.secretName" .) }}
                  key: secret-key
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret | default (include "hoteler.secretName" .) }}
                  key: redis-password
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret | default (include "hoteler.secretName" .) }}
                  key: datasource-password
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "500Mi"
            limits:
              cpu: "500m"
              memory: "1536Mi"
          volumeMounts:
            - mountPath: /app/config
              name: config
      volumes:
        - configMap:
            name: {{ include "hoteler.api.configName" . }}
          name: config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "hoteler.web.fullname" . }}
  labels:
    app:  {{ include "hoteler.web.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "hoteler.web.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "hoteler.web.fullname" . }}
      name: {{ include "hoteler.web.fullname" . }}
      annotations:
        checksum/config: {{ include "hoteler.configChecksum" . }}
        checksum/secret: {{ include "hoteler.secretChecksum" . }}
    spec:
      containers:
        - name: {{ include "hoteler.web.fullname" . }}
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "hoteler.web.configName" . }}
                  key: backend_url