app:
  # 资源名后缀，最终名称为 <release 名>-<后缀>
  namespace: hoteler-namespace
  name: api
  configMapName: api-config
  web:
    name: web
    configMapName: web-config
    ingress:
      host: hoteler.local

replicaCount: 1

image:
  repository: ghcr.io/damingerdai/hoteler-api
  tag: "v0.0.7"
  pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/damingerdai/hoteler-web
    tag: "v0.0.7"
    pullPolicy: IfNotPresent

# 同一 namespace 中已有的 kubernetes.io/dockerconfigjson Secret，应用于 api 和 web。
imagePullSecrets: []
# 例如：
#   - name: ghcr-pull

# 新数据库可启用 Flyway；已有数据库需先确认迁移历史。
flyway:
  enabled: false
  baselineOnMigrate: false

secret:
  # 自动创建的 Secret 名称后缀，最终名称为 <release 名>-<后缀>
  name: api-secret
  # JWT/HMAC 签名密钥。留空时首次安装自动生成随机值，升级时自动复用；
  # 如需固定值（例如与已有部署保持一致），在此设置或使用 existingSecret。
  key: ""
  # 复用已有的 Secret（需包含 secret-key 键）。设置后不再创建 Secret。
  existingSecret: ""

redis:
  host: redis
  port: 6379
  database: 0
  # 密码不会写入 ConfigMap，而是通过 Secret 以环境变量注入。
  # 请用 --set、私有 values 文件或 secret.existingSecret 提供，不要提交真实密码。
  password: "12345"

datasource:
  url: jdbc:postgresql://postgres:5432/postgres
  username: postgres
  # 同上，密码通过 Secret 注入
  password: "123456"

service:
  type: NodePort
  port: 8443
  nodePort: 30006
  web:
    nodePort: 30007

hpa:
  # 默认关闭。开启后 Deployment 不再设置 replicas，由 HPA 管理副本数；
  # 集群需要安装 metrics-server，并根据需要调大 replicaCount.max。
  enabled: false
  replicaCount:
    max: 1
    min: 1
