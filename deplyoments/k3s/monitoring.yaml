apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hoteler-api-monitor
  namespace: hoteler-namespace
  labels:
    release: prometheus
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app: hoteler-api
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s