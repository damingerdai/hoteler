name: Build and Publish

#on:
#  push:
#    branches: [ master ]
#    paths:
#      - 'src/**'
#      - 'pom.xml'
#      - 'build.gradle'
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.0.5"
        required: true
        type: string

jobs:
  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/damingerdai/hoteler-api
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest
            type=sha,prefix=
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Github Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build image and push to GitHub Container Registry
        uses: docker/build-push-action@v7
        id: docker_build
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          # push: ${{ github.ref == 'refs/heads/master' }}
          push: true
          # load: true
          platforms: linux/amd64,linux/arm64
          provenance: true
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 40

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      - name: Output image tag
        run: echo "image_tag=$(echo ${{ steps.meta.outputs.tags }} | cut -d' ' -f1)" >> $GITHUB_OUTPUT
        id: output_tag
