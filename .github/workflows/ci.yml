
name: Java CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.build-tool }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build-tool: [gradle, maven]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:8.10.3-alpine3.23
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"
          cache: ${{ matrix.build-tool }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache-dependency-path: migration/go.sum

      - name: Run database migration
        working-directory: migration
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: postgres
          POSTGRES_SSLMODE: disable
        run: |
          go build -o hoteler .
          ./hoteler migrate up

      - name: Test with Gradle
        if: matrix.build-tool == 'gradle'
        env:
          CI: true
        run: |
          ./gradlew test \
            -x checkstyleMain \
            -x checkstyleTest \
            --no-daemon

      - name: Test with Maven
        if: matrix.build-tool == 'maven'
        env:
          CI: true
        run: |
          ./mvnw test \
            -B \
            -Dcheckstyle.skip=true

      - name: Generate Maven Surefire Report
        if: always() && matrix.build-tool == 'maven'
        env:
          CI: true
        run: |
          ./mvnw surefire-report:report-only -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.build-tool }}
          path: |
            build/test-results/test/
            build/reports/tests/test/
            target/surefire-reports/
            target/site/surefire-report.html
          if-no-files-found: ignore
          retention-days: 7

  build-docker:
    name: Docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [test]

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gradle
            dockerfile: Dockerfile
          - name: full
            dockerfile: full.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Verify Angular submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule update --remote --recursive
          git submodule status
          git -C src/main/angular rev-parse HEAD
          ls -la src/main/angular/
          test -f src/main/angular/package.json
          test -f src/main/angular/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: false
          tags: ghcr.io/damingerdai/hoteler-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=hoteler-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=hoteler-${{ matrix.name }}
