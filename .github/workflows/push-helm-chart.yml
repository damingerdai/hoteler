name: Push Helm chart

on:
  workflow_dispatch:
    inputs:
      chart-version:
        description: "Chart version (must match Chart.yaml; leave empty to use Chart.yaml)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  push-helm-chart:
    name: Push Helm chart to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0

      - name: Test chart packaging and templates
        run: node --test scripts/test-helm.mjs

      - name: Push Helm chart
        shell: bash
        run: bash scripts/push-helm-chart.sh "${REQUESTED_VERSION}"
        env:
          REQUESTED_VERSION: ${{ inputs.chart-version }}
          GITHUB_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
