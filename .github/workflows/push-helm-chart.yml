name: Push Helm chart

on:
  workflow_dispatch:
    inputs:
      chart-version:
        description: "Chart version (leave empty to use Chart.yaml)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  push-helm-chart:
    name: Push Helm chart to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Push Helm chart
        run: ./scripts/push-helm-chart.sh "${{ inputs.chart-version }}"
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_OWNER: ${{ github.repository_owner }}
