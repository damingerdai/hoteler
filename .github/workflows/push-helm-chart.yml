name: Push Helm chart

on:
  workflow_dispatch:
    inputs:
      chart-version:
        description: "Chart version (must match Chart.yaml; leave empty to use Chart.yaml)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  push-helm-chart:
    name: Push Helm chart to GHCR
    runs-on: ubuntu-latest
    env:
      CHART_DIR: deplyoments/helm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0

      - name: Resolve chart version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.chart-version }}
        run: |
          set -euo pipefail

          chart_version="$(awk '$1 == "version:" {gsub(/"/, "", $2); gsub(/\047/, "", $2); print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          if [[ -n "${REQUESTED_VERSION}" && "${REQUESTED_VERSION}" != "${chart_version}" ]]; then
            echo "Requested version ${REQUESTED_VERSION} does not match Chart.yaml version ${chart_version}; bump Chart.yaml first." >&2
            exit 1
          fi
          echo "version=${chart_version}" >> "$GITHUB_OUTPUT"

      - name: Push Helm chart
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          package_dir="$(mktemp -d)"
          trap 'rm -rf "${package_dir}"' EXIT

          helm lint "${CHART_DIR}"
          helm package "${CHART_DIR}" --destination "${package_dir}"

          printf '%s' "${GHCR_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_USERNAME}" \
            --password-stdin

          helm push "${package_dir}/hoteler-chart-${version}.tgz" \
            "oci://ghcr.io/${GHCR_OWNER}"
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
