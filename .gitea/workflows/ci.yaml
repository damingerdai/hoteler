name: Java CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY_NAME: github.com

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        java-version: [25]
        os: [ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_SSL_NO_VERIFY: "true"
      - name: Download JDK from Domestic Mirror
        run: |
          curl -L -o jdk-25.tar.gz https://mirrors.huaweicloud.com/openjdk/25.0.2/openjdk-25.0.2_linux-x64_bin.tar.gz

      - name: Set up JDK from local archive
        uses: actions/setup-java@v5
        with:
          distribution: "jdkfile"
          jdkFile: jdk-25.tar.gz
          java-version: ${{ matrix.java-version }}
      - name: Configure Maven with China Mirrors
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <mirrors>
              <mirror>
                <id>aliyun</id>
                <name>Aliyun Maven Mirror</name>
                <url>https://maven.aliyun.com/repository/public</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
              <mirror>
                <id>huaweicloud</id>
                <name>Huawei Cloud Maven Mirror</name>
                <url>https://repo.huaweicloud.com/repository/maven/</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Build root project
        run: |
          chmod +x ./mvnw
          ./mvnw clean install -Dmaven.test.skip=true
  build-gradle:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        java-version: [25]
        os: [ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_SSL_NO_VERIFY: "true"

      - name: Download JDK from Domestic Mirror
        run: |
          curl -L -o jdk-25.tar.gz https://mirrors.huaweicloud.com/openjdk/25.0.2/openjdk-25.0.2_linux-x64_bin.tar.gz

      - name: Set up JDK from local archive
        uses: actions/setup-java@v4
        with:
          distribution: "jdkfile"
          jdkFile: jdk-25.tar.gz
          java-version: ${{ matrix.java-version }}

      - name: Configure Gradle with China Mirrors
        run: |
          sed -i 's|https\\://services.gradle.org/distributions|https\\://mirrors.cloud.tencent.com/gradle|g' gradle/wrapper/gradle-wrapper.properties
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'EOF'
          allprojects {
              repositories {
                  rm ->
                      def removeRepository = { repository ->
                          repositories.remove(repository)
                      }
                  all { ArtifactRepository repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          def url = repo.url.toString()
                          if (url.startsWith('https://repo.maven.apache.org/maven2') || url.startsWith('https://jcenter.bintray.com/')) {
                              removeRepository(repo)
                          }
                      }
                  }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              }
          }
          EOF

      - name: Build root project with Gradle Wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test